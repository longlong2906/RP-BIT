# Six fixed arms; 36 trials; application cold start; no pilot/full.
schema_version: 9
project: bitstar_25d
language: vi
model:
  state: xy
  local_connector: straight_xy_lifted_to_piecewise_affine_heightfield
  objective: surface_length_traversability
  surface_interpolation: fixed_diagonal_triangles
  cell_diagonal: southwest_to_northeast
  height_units: m
  coordinate_units: m
  nodata_policy: forbidden
  obstacle_contact_policy: forbidden
  include_outside_map_as_forbidden: true
  robot_radius_m: 0.3
  safety_margin_m: 0.1
  max_slope_deg: 35.0
  roughness_limit_m: null
  roughness_window_m: 1.0
  goal: singleton
  goal_roundoff_tolerance_m: 1.0e-09
  numerical_abs_tolerance_m: 1.0e-08
  numerical_rel_tolerance: 1.0e-08
algorithm:
  nearest_neighbor_metric: euclidean_xy
  bitstar_connection: k_nearest
  bitstar_samples_per_batch: 200
  bitstar_rewire_factor: 1.1
  bitstar_just_in_time_sampling: false
  informed_sample_attempts_per_call: 100
  informed_measure_policy: audit_and_use_documented_conservative_fallback
  edge_cache: false
  graph_pruning_requested: true
  fail_if_requested_variant_not_effective: true
  simplification: false
  approximate_solution_counts_as_success: false
  sampler_query_cache: false
  traversability_build_policy: legacy
  exact_flat_certificate: false
execution:
  jobs: 1
  one_process_per_trial: true
  seed_before_creating_planner: true
  shuffle_trial_order_seed: 73129
  save_trial_manifest: true
  resume_by_config_hash: true
  watchdog_grace_s: 5.0
  memory_limit_mb: 4096
  default_profile: smoke
  full_requires_explicit_flag: true
  timing_origin: immediately_before_solve
  record_preprocessing_separately: true
  record_setup_separately: true
  offline_validation_separately: true
logging:
  progress_interval_s: 0.05
  save_improvement_events: true
  save_improvement_paths: true
  save_ompl_benchmark_log: true
  save_path_xy: true
  save_path_surface_breakpoints: true
  save_full_tree: false
  keep_failures: true
  strict_json_no_nan_or_infinity: true
analysis:
  target_relative_tolerances:
  - 0.1
  - 0.05
  - 0.02
  require_reference_provenance: true
  confidence_level: 0.95
  bootstrap_unit_order:
  - map
  - query
  - seed
  ignore_unexecuted_trials_in_success_denominator: true
  separately_report_unexecuted_trials: true
  include_executed_timeouts_in_success_denominator: true
profiles:
  smoke:
    map_extent_m:
    - 20.0
    - 20.0
    grid_spacing_m: 0.2
    families:
    - flat
    - tilted
    - unsafe_short_safe_detour
    - two_corridors_slope
    - two_corridors_clearance
    - nodata_thin_obstacle
    maps_per_family: 1
    queries_per_map: 1
    map_seeds:
    - 101
    planner_seeds:
    - 11
    planners:
    - a3_perf_baseline
    - a3_perf_sampler
    - a3_perf_preprocessing
    - a3_perf_both_kernels
    - a3_perf_certificate
    - a3_perf_all
    planning_budget_s: 2.0
    purpose: cold_start_sampler_and_certificate_correctness_smoke_not_ranking
planner_variants:
  a3_perf_baseline:
    planner_id: bitstar_a3
    state_cache: true
    scalar_cost: true
    collision_index: true
    sampler_query_cache: false
    traversability_build_policy: legacy
    exact_flat_certificate: false
  a3_perf_sampler:
    planner_id: bitstar_a3
    state_cache: true
    scalar_cost: true
    collision_index: true
    sampler_query_cache: true
    traversability_build_policy: legacy
    exact_flat_certificate: false
  a3_perf_preprocessing:
    planner_id: bitstar_a3
    state_cache: true
    scalar_cost: true
    collision_index: true
    sampler_query_cache: false
    traversability_build_policy: skip_dominated
    exact_flat_certificate: false
  a3_perf_both_kernels:
    planner_id: bitstar_a3
    state_cache: true
    scalar_cost: true
    collision_index: true
    sampler_query_cache: true
    traversability_build_policy: skip_dominated
    exact_flat_certificate: false
  a3_perf_certificate:
    planner_id: bitstar_a3
    state_cache: true
    scalar_cost: true
    collision_index: true
    sampler_query_cache: false
    traversability_build_policy: legacy
    exact_flat_certificate: true
  a3_perf_all:
    planner_id: bitstar_a3
    state_cache: true
    scalar_cost: true
    collision_index: true
    sampler_query_cache: true
    traversability_build_policy: skip_dominated
    exact_flat_certificate: true
optional_ablations:
  enabled: false
  require_independent_policy_tests: true
  planners:
  - bitstar_a1
  - bitstar_a2
optional_extensions:
  real_maps: false
  cgal_reference: false
  aitstar: false
  abitstar: false
  physics_simulation: false
  constrained_3d_comparison: false
traversability:
  feature_version: cell_envelope_v1
  lambda: 1.0
  slope_weight: 0.5
  clearance_weight: 0.5
  clearance_comfort_m: 0.4
